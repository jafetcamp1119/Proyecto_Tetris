<ion-app>
  <ion-router-outlet [style.visibility]="vigilancia.cerrando() ? 'hidden' : null" [attr.inert]="orientacion.requiereVertical() || vigilancia.cerrando() ? '' : null" [attr.aria-hidden]="orientacion.requiereVertical() || vigilancia.cerrando() ? 'true' : null"></ion-router-outlet>
  @if (vigilancia.mensajeConexion()) {
    <aside class="aviso-conexion tarjeta-tetris" role="status">{{ vigilancia.mensajeConexion() }}
      <button class="accion secundaria" (click)="verificarSesion()">Reintentar</button>
    </aside>
  }
  <app-orientacion-vertical />
  @if (audio.requiereInteraccion() && (audio.preferencias().musicaActiva || audio.preferencias().efectosActivos)) {
    <button class="activar-audio" (click)="activarAudio()">♪ Activar sonido</button>
  }
</ion-app>
